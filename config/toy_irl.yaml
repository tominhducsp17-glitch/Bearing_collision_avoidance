# Mốc 4: bài toán đồ chơi tuyến tính cho Algorithm 2 (off-policy H∞ IRL)
# x_dot = A x + B u + E d ; cost e^{-alpha t}(x'Qx + u'Ru - gamma^2 d'd)
name: toy_2d
A: [[0.0, 1.0], [-1.0, -0.5]]
B: [[0.0], [1.0]]
E: [[0.0], [0.5]]
Q: [[1.0, 0.0], [0.0, 1.0]]
R: [[1.0]]
gamma: 5.0
alpha: 0.1
x0: [1.0, -1.0]
irl:
  n_sub: 10
  eps: 1.0e-10
  max_iter: 40
# lưới quét độ nhạy
sweep:
  T: [0.001, 0.01, 0.05]
  duration: [1.0, 5.0, 10.0]     # s, M = duration / T
  probe_amp: [0.01, 0.1, 1.0, 10.0]
